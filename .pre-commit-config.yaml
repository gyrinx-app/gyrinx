# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# fail_fast: true
# Hook environments must match the project runtime. Several hooks parse
# Python with Python (check-ast, debug-statements, bandit); on 3.12 they
# cannot parse the PEP 758 `except A, B:` this codebase now uses, and every
# commit fails with a SyntaxError that reads like a bug in the code.
default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/djlint/djLint
    rev: v1.44.2
    hooks:
      # django-cotton component files are hand-formatted and byte-significant:
      # every one carries `djlint:off`, and djlint --reformat appends a trailing
      # newline regardless, which renders as a space between adjacent inline
      # badges/buttons. pyproject's [tool.djlint] extend_exclude covers directory
      # and repo-root invocations (scripts/fmt.sh) but NOT the explicit file
      # paths pre-commit passes, so the exclusion is repeated here.
      - id: djlint-reformat-django
        exclude: ^(gyrinx|n26/core)/templates/cotton/
      - id: djlint-django
        exclude: ^(gyrinx|n26/core)/templates/cotton/

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        name: nbstripout
        description: "nbstripout: strip output from Jupyter and IPython notebooks"
        language: python
        types: [jupyter]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        types_or: [python, pyi]
        pass_filenames: false
        args:
          [
            "-c",
            "pyproject.toml",
            "-r",
            ".",
            "--baseline",
            "bandit/bandit-baseline.json",
          ]
        additional_dependencies: ["bandit[toml]"]

  # Lint GitHub Actions workflow files
  - repo: https://github.com/mpalmer/action-validator
    rev: v0.9.0
    hooks:
      - id: action-validator

  - repo: local
    hooks:
      - id: check-fmt
        name: check-fmt
        entry: ./scripts/fmt-check.sh
        language: script
        types_or: [scss, javascript, json, markdown, yaml]
        pass_filenames: false

      # Hand-written Bootstrap markup may not increase. Templates should use the
      # components in gyrinx/templates/cotton/ instead; see
      # scripts/raw_markup_baseline.json for the current ceiling. A pytest test
      # runs the same script, so CI enforces it too.
      - id: check-raw-markup
        name: check-raw-markup
        entry: python3 scripts/check_raw_markup.py
        language: system
        types: [html]
        pass_filenames: false

      # Component call-site contract: props that must be passed with a colon,
      # conditional attributes cotton silently drops, undeclared props that skip
      # escaping. Also run by test_cotton_call_site_gates.py in CI.
      - id: check-cotton
        name: check-cotton
        entry: ./scripts/check_cotton.sh
        language: script
        types: [html]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        # django-cotton components must NOT end with a newline. A component's
        # file content is emitted verbatim, so a trailing newline lands after
        # the closing tag and collapses to a rendered space between adjacent
        # inline elements -- e.g. the dice-result badges butted together in
        # core/campaign/campaign_action_outcome.html:22.
        exclude: ^(gyrinx|n26/core)/templates/cotton/
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: name-tests-test
        args: [--django]
        # The n26 edition's test-support modules (its shared fixtures and the
        # example-suite action vocabulary) live beside the tests they serve.
        exclude: ^n26/tests/(fixtures\.py|sandbox/actions\.py)$
      # - id: no-commit-to-branch
      - id: sort-simple-yaml
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: check-migrations
        name: Check for missing migrations
        entry: ./scripts/check_migrations.sh
        language: script
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: check-migration-conflicts
        name: Check for migration conflicts
        entry: ./scripts/check_migration_conflicts.sh
        language: script
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint
        entry: npx markdownlint-cli2 --fix
        language: system
        files: \.md$

  # Skipped becuase they take too long
