name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]
  merge_group:
  workflow_dispatch:
    inputs:
      send_test_page:
        description: "Send a real test page via incident.io"
        type: boolean
        required: true
        default: false
      failed_suite:
        description: "Simulated failing suite"
        type: choice
        required: true
        default: both
        options: [core, full, both]

permissions:
  id-token: write
  contents: read
  pull-requests: write

# Cancel all obsolete PR shards together. Non-PR runs have separate groups,
# so newer main pushes cannot cancel earlier required evidence.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The two existing test jobs run disjoint full-suite shards on every normal
# event. `test` is the required check: it waits for its companion and verifies
# that every collected test completed exactly once. This includes core and
# changed tests without executing a duplicate subset. fresh-database is the
# only job here that applies the migration graph.
jobs:
  test:
    # Only main can skip suites for a paging smoke test. A manual run on a
    # PR branch must execute the required check: skipped jobs satisfy it.
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      actions: read
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_NAME: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_CONFIG: '{"user":"postgres","password":"postgres"}'
      # The core suite must stay small for fast focused local checks, and
      # must not silently select nothing if the marker expression breaks.
      # The count is the tests marked core on the branch, so a main suite
      # sitting on the max fails the next pull request that marks another
      # test core. The bounds script warns when the count is within
      # CORE_SUITE_HEADROOM of the max.
      CORE_SUITE_MIN: 300
      CORE_SUITE_MAX: 1400
      CORE_SUITE_HEADROOM: 50
    steps:
      - uses: actions/checkout@v7
        with:
          # Use the event revision, including GitHub's PR merge commit.
          fetch-depth: 0

      - name: Verify the checked-out revision
        shell: bash
        run: |
          printf 'head=%s\n' "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: ./.github/actions/python-env
        with:
          postgres-container: ${{ job.services.postgres.id }}

      - name: Check the core suite is neither empty nor the whole suite
        shell: bash
        run: |
          source .venv/bin/activate
          # pytest exits 5 when the marker selects nothing; that case must
          # reach the bounds script below. Any other failure is a collection
          # error and fails the step.
          status=0
          listing=$(pytest -m core --collect-only -q -n 0) || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then
            echo "::error::collecting the core suite failed (pytest exit $status)"
            exit "$status"
          fi
          count=$(grep -c '::' <<<"$listing" || true)
          python scripts/check_core_suite_bounds.py \
            "$count" "$CORE_SUITE_MIN" "$CORE_SUITE_MAX" "$CORE_SUITE_HEADROOM"

      - uses: ./.github/actions/react-build

      - name: Record runner CPU and PostgreSQL compilation capability
        shell: bash
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          lscpu
          docker exec "$PG_CONTAINER_ID" psql -U postgres -Atc \
            "SELECT version(), pg_jit_available(), current_setting('jit'), current_setting('jit_above_cost');"

      - name: Run full-suite shard zero
        # Both shards collect everything before assigning whole modules.
        # Four workers per existing runner avoid oversubscribing four CPUs.
        timeout-minutes: 45
        run: |
          source .venv/bin/activate
          python scripts/measure_test_performance.py --label ci-shard-0 -- \
            -v -n 4 -p gyrinx.pytest_suite_shards \
            --suite-shard-count 2 --suite-shard-index 0 \
            --suite-shard-manifest logs/full-suite-shard.json

      - name: Upload required shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: suite-${{ github.run_id }}-${{ github.run_attempt }}-shard-0
          if-no-files-found: error
          path: |
            logs/full-suite-shard.json
            logs/test-performance/ci-shard-0.json
            logs/test-performance/ci-shard-0.xml

      - name: Verify both shards completed the full suite exactly once
        if: success()
        timeout-minutes: 16
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          source .venv/bin/activate
          python scripts/wait_for_ci_job.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --job-name test-full \
            --head-sha "$EXPECTED_HEAD_SHA"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "suite-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-shard-1" \
            --dir logs/other-shard
          python scripts/verify_test_shards.py --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            logs/full-suite-shard.json logs/other-shard/full-suite-shard.json \
            | tee logs/full-suite-verification.json
          cat logs/full-suite-verification.json >> "$GITHUB_STEP_SUMMARY"

  test-full:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_NAME: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_CONFIG: '{"user":"postgres","password":"postgres"}'
    steps:
      - uses: actions/checkout@v7
        with:
          # Use the event revision, including GitHub's PR merge commit.
          fetch-depth: 0

      - name: Verify the checked-out revision
        shell: bash
        run: |
          printf 'head=%s\n' "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: ./.github/actions/python-env
        with:
          postgres-container: ${{ job.services.postgres.id }}

      - uses: ./.github/actions/react-build

      - name: Record runner CPU and PostgreSQL compilation capability
        shell: bash
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          lscpu
          docker exec "$PG_CONTAINER_ID" psql -U postgres -Atc \
            "SELECT version(), pg_jit_available(), current_setting('jit'), current_setting('jit_above_cost');"

      - name: Run full-suite shard one
        timeout-minutes: 45
        run: |
          source .venv/bin/activate
          python scripts/measure_test_performance.py --label ci-shard-1 -- \
            -v -n 4 -p gyrinx.pytest_suite_shards \
            --suite-shard-count 2 --suite-shard-index 1 \
            --suite-shard-manifest logs/full-suite-shard.json

      - name: Upload companion shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: suite-${{ github.run_id }}-${{ github.run_attempt }}-shard-1
          if-no-files-found: error
          path: |
            logs/full-suite-shard.json
            logs/test-performance/ci-shard-1.json
            logs/test-performance/ci-shard-1.xml

  page-on-main-failure:
    needs: [test, test-full]
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && inputs.send_test_page) ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        (needs.test.result == 'failure' || needs.test-full.result == 'failure')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Page incident.io for failed suites
        env:
          INCIDENT_IO_ALERT_TOKEN: ${{ secrets.INCIDENT_IO_ALERT_TOKEN }}
          CORE_RESULT: ${{ needs.test.result }}
          FULL_RESULT: ${{ needs.test-full.result }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_SUITE: ${{ inputs.failed_suite }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$INCIDENT_IO_ALERT_TOKEN" ]; then
            echo "::error::Set the repository Actions secret INCIDENT_IO_ALERT_TOKEN to enable paging."
            exit 1
          fi

          alert_scope=main
          alert_title="Gyrinx main tests failed"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            alert_scope=ci-test
            alert_title="[TEST] Gyrinx test paging"
            CORE_RESULT=success
            FULL_RESULT=success
            case "$TEST_SUITE" in
              core) CORE_RESULT=failure ;;
              full) FULL_RESULT=failure ;;
              both) CORE_RESULT=failure; FULL_RESULT=failure ;;
              *) echo "::error::Unknown simulated failing suite: $TEST_SUITE"; exit 1 ;;
            esac
          fi

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$RUN_URL" \
            --arg alert_scope "$alert_scope" \
            --arg title "$alert_title" \
            --arg core_result "$CORE_RESULT" \
            --arg full_result "$FULL_RESULT" \
            '([{suite: "core", result: $core_result}, {suite: "full", result: $full_result}] |
              map(select(.result == "failure") | .suite) | join(", ")) as $suites |
            {
              title: ($title + ": " + $suites),
              description: ("Failed suites: " + $suites + ". Commit: " + $sha + ". Run: " + $run_url),
              deduplication_key: ($repository + ":" + $alert_scope + ":tests:" + $run_id),
              status: "firing",
              source_url: $run_url,
              metadata: {
                service: "gyrinx",
                environment: "main",
                test_alert: ($alert_scope == "ci-test"),
                repository: $repository,
                commit: $sha,
                failed_suites: $suites,
                core_result: $core_result,
                full_result: $full_result
              }
            }' > alert.json

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 --retry 3 --retry-max-time 120 \
            --request POST \
            --header "Authorization: Bearer $INCIDENT_IO_ALERT_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @alert.json \
            https://api.incident.io/v2/alert_events/http/01M49CV2PWF1478S7W23RXSFSN

  # Applies the whole migration graph to an empty database, which nothing else
  # here does: pytest builds the schema straight from the models
  # (--nomigrations), and the conflict check reads the graph without running
  # it. Both stay green while a from-scratch apply is broken, which is how
  # #2231 survived — a state-only app-move migration ran before the n23 core
  # migration that made the table it had adopted, and only a database that
  # already had the table hid it.
  #
  # Its own job rather than a step in `test` so the migrate does not sit in
  # front of the test result.
  #
  # On a pull request the migrate only runs when the change touches what a
  # from-scratch apply depends on, as scripts/fresh_database_needed.py decides:
  # migration files, an app's apps.py, the settings, the dependency lock, and
  # the project modules the migrations import. Most of the migrate's time is
  # Django re-rendering model state between migrations, which a pull request
  # that touches none of those cannot change. Every other event runs it
  # unconditionally.
  fresh-database:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_NAME: gyrinx_fresh
      DB_HOST: localhost
      DB_PORT: 5432
      DB_CONFIG: '{"user":"postgres","password":"postgres"}'
    steps:
      - uses: actions/checkout@v7
        with:
          # The migration-graph check diffs against the base branch.
          fetch-depth: 0

      - name: Decide whether the migration graph changed
        id: graph
        # Runs on the runner's python before the project environment exists;
        # the script is standard library only. A failure in the script fails
        # the step, so the check never skips the migrate by accident.
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: migrating"
            exit 0
          fi
          changed=$(python3 scripts/fresh_database_needed.py "origin/$BASE_REF")
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "the migration graph or something it depends on changed:"
            echo "$changed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "nothing the migration graph depends on changed: skipping the migrate"
          fi

      - uses: ./.github/actions/python-env
        if: steps.graph.outputs.run == 'true'

      # A database of its own, so the run starts from genuinely nothing rather
      # than from whatever the service image left in `postgres`.
      - name: Create an empty database
        if: steps.graph.outputs.run == 'true'
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE gyrinx_fresh;'

      - name: Migrate the empty database
        if: steps.graph.outputs.run == 'true'
        timeout-minutes: 30
        run: |
          source .venv/bin/activate
          manage migrate
