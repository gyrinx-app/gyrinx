name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]
  merge_group:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_NAME: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_CONFIG: '{"user":"postgres","password":"postgres"}'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --locked installs exactly uv.lock and fails if it has drifted from
      # pyproject.toml, so the install is also the staleness check.
      - name: Install dependencies
        run: uv sync --locked

      - name: Write to .env file
        run: |
          echo "SECRET_KEY=test-secret" >> .env
          echo "DJANGO_SUPERUSER_PASSWORD=password" >> .env

      - name: Tune PostgreSQL for parallel test workloads
        # pytest-xdist with --nomigrations spins up many workers that each
        # create all tables via syncdb; default max_locks_per_transaction
        # (64) is too low and tests deadlock.  Mirrors the tuning in
        # docker-compose.yml and scripts/setup_web.sh.
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER_ID" \
            psql -U postgres -c "ALTER SYSTEM SET max_locks_per_transaction = 256;"
          docker restart "$PG_CONTAINER_ID"
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres -q && exit 0
            sleep 1
          done
          echo "PostgreSQL did not become ready after restart" >&2
          exit 1

      - name: Run tests in parallel
        timeout-minutes: 60
        # pyproject's `-n auto` counts physical cores, which on the 4-vCPU
        # runner is 2. `-n logical` uses all 4; the later flag wins.
        run: |
          source .venv/bin/activate
          pytest --durations=20 -v -n logical

      - name: Run Bandit security scan
        run: |
          source .venv/bin/activate && \
          bandit -c pyproject.toml -r . --baseline bandit/bandit-baseline.json

  # Applies the whole migration graph to an empty database, which nothing else
  # here does: pytest builds the schema straight from the models
  # (--nomigrations), and the conflict check reads the graph without running
  # it. Both stay green while a from-scratch apply is broken, which is how
  # #2231 survived — a state-only app-move migration ran before the n23 core
  # migration that made the table it had adopted, and only a database that
  # already had the table hid it.
  #
  # Its own job rather than a step in `test` so a four-minute migrate does not
  # sit in front of the test result.
  fresh-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_NAME: gyrinx_fresh
      DB_HOST: localhost
      DB_PORT: 5432
      DB_CONFIG: '{"user":"postgres","password":"postgres"}'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Write to .env file
        run: |
          echo "SECRET_KEY=test-secret" >> .env
          echo "DJANGO_SUPERUSER_PASSWORD=password" >> .env

      # A database of its own, so the run starts from genuinely nothing rather
      # than from whatever the service image left in `postgres`.
      - name: Create an empty database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE gyrinx_fresh;'

      - name: Migrate the empty database
        timeout-minutes: 30
        run: |
          source .venv/bin/activate
          manage migrate
