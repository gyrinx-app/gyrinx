name: CI Checks

on:
  # No base-branch filter: stacked PRs target another feature branch, and a
  # `branches: [main]` filter would skip them — but ci-checks is a required
  # status check once the PR retargets to main, so it must run on every PR.
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/python-env

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node dependencies
        run: npm ci

      - name: Check Python formatting with ruff
        run: |
          source .venv/bin/activate && \
          ruff check . && \
          ruff format --check .

      - name: Check Django template formatting with djlint
        run: |
          source .venv/bin/activate && \
          djlint --profile=django --lint --check .

      - name: Check JavaScript/CSS/SCSS/JSON/YAML/Markdown formatting with prettier
        run: |
          source .venv/bin/activate && \
          npm run fmt-check

      - name: Run Bandit security scan
        run: |
          source .venv/bin/activate && \
          bandit -c pyproject.toml -r . --baseline bandit/bandit-baseline.json

      - name: Check for migration conflicts
        run: |
          source .venv/bin/activate && \
          ./scripts/check_migration_conflicts.sh

      - name: Check Jupyter notebooks are stripped
        run: |
          source .venv/bin/activate
          # Find all Jupyter notebooks and check if they have outputs
          find . -name "*.ipynb" -type f -print0 | xargs -0 -I {} sh -c '
            if nbstripout --verify "$1"; then
              echo "✓ $1 is properly stripped"
            else
              echo "✗ $1 contains outputs that should be stripped"
              exit 1
            fi
          ' _ {}
