name: Format Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # --locked installs exactly uv.lock and fails if it has drifted from
      # pyproject.toml, so every install path is also the staleness check. That
      # replaces the dedicated `uv lock --check` step this used to need.
      - name: Install dependencies
        run: uv sync --locked

      - name: Write to .env file
        run: |
          echo "SECRET_KEY=test-secret" >> .env
          echo "DJANGO_SUPERUSER_PASSWORD=password" >> .env

      - name: Install Node dependencies
        run: npm ci

      - name: Check Python formatting with ruff
        run: |
          source .venv/bin/activate && \
          ruff check . && \
          ruff format --check .

      - name: Check Django template formatting with djlint
        run: |
          source .venv/bin/activate && \
          djlint --profile=django --lint --check .

      - name: Check JavaScript/CSS/SCSS/JSON/YAML/Markdown formatting with prettier
        run: |
          source .venv/bin/activate && \
          npm run fmt-check

      - name: Check for migration conflicts
        run: |
          source .venv/bin/activate && \
          ./scripts/check_migration_conflicts.sh

      - name: Check Jupyter notebooks are stripped
        run: |
          source .venv/bin/activate
          # Find all Jupyter notebooks and check if they have outputs
          find . -name "*.ipynb" -type f -print0 | xargs -0 -I {} sh -c '
            if nbstripout --verify "$1"; then
              echo "✓ $1 is properly stripped"
            else
              echo "✗ $1 contains outputs that should be stripped"
              exit 1
            fi
          ' _ {}
