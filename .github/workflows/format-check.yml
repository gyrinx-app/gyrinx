name: Format Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          uv venv .venv && \
          uv pip install --editable .

      # uv.lock is not installed from — the image and CI resolve from
      # requirements.txt — so nothing exercised it and it silently rotted, at
      # one point holding a Twisted version a full major release behind and
      # generating a high-severity alert on its own (see #2038). --refresh is
      # required: dependencies are dynamic (read from requirements.txt), and
      # without it uv compares against cached project metadata and reports a
      # stale lock as current.
      - name: Check uv.lock is up to date
        run: uv lock --check --refresh

      - name: Write to .env file
        run: |
          echo "SECRET_KEY=test-secret" >> .env
          echo "DJANGO_SUPERUSER_PASSWORD=password" >> .env

      - name: Install Node dependencies
        run: npm ci

      - name: Check Python formatting with ruff
        run: |
          source .venv/bin/activate && \
          ruff check . && \
          ruff format --check .

      - name: Check Django template formatting with djlint
        run: |
          source .venv/bin/activate && \
          djlint --profile=django --lint --check .

      - name: Check JavaScript/CSS/SCSS/JSON/YAML/Markdown formatting with prettier
        run: |
          source .venv/bin/activate && \
          npm run fmt-check

      - name: Check for migration conflicts
        run: |
          source .venv/bin/activate && \
          ./scripts/check_migration_conflicts.sh

      - name: Check Jupyter notebooks are stripped
        run: |
          source .venv/bin/activate
          # Find all Jupyter notebooks and check if they have outputs
          find . -name "*.ipynb" -type f -print0 | xargs -0 -I {} sh -c '
            if nbstripout --verify "$1"; then
              echo "✓ $1 is properly stripped"
            else
              echo "✗ $1 contains outputs that should be stripped"
              exit 1
            fi
          ' _ {}
