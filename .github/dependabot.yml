# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      python-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # setuptools 82 removed pkg_resources, which Google Cloud packages still use.
      # Re-enable once google-cloud-* packages drop their pkg_resources dependency.
      - dependency-name: "setuptools"
        versions: [">=82.0.0"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      npm-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # stylelint 17 is incompatible with stylelint-config-twbs-bootstrap (requires ^16.11.0).
      # Re-enable once stylelint-config-twbs-bootstrap releases a v17-compatible version.
      - dependency-name: "stylelint"
        versions: [">=17.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # .pre-commit-config.yaml pins its own djlint/ruff, independent of
  # requirements.txt. While the two agree the drift is invisible; when they
  # diverge the commit hook reverts the exact reformat CI demands and no commit
  # can satisfy both (see #2038). Keep them moving together.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit:
        patterns:
          - "*"

  # The Dockerfile pins the uv release it copies its binary from.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
