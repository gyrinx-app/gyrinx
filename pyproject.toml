[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "gyrinx"
dynamic = ["version"]
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.12.1",
    "bandit==1.9.4",
    "beautifulsoup4==4.15.0",
    "bleach[css]==6.4.0",
    "click==8.5.0",
    "Django==6.0.7",
    "django-allauth==65.19.2",
    "django-cotton==2.7.2",
    "django-cotton-ui==0.3.2",
    "django-csp==4.0",
    "django-debug-toolbar==7.1.1",
    "django-extensions==4.1",
    "django-multiselectfield==1.0.1",
    "django-polymorphic==4.11.7",
    "django-recaptcha==4.1.0",
    "django-simple-history==3.13.0",
    "django-storages[google]==1.14.6",
    "django-tinymce==5.0.0",
    "djlint==1.44.2",
    "docutils==0.23",
    "fido2==2.2.1",
    "filelock==3.32.5",
    "google-cloud-logging==3.16.3",
    "google-cloud-pubsub==2.39.2",
    "google-cloud-scheduler==2.20.0",
    "google-cloud-sqlcommenter==2.0.0",
    "gunicorn==26.2.0",
    "jsonschema==4.26.0",
    "nbstripout==0.9.1",
    "nodeenv==1.10.0",
    "opentelemetry-exporter-gcp-trace==1.15.0",
    "opentelemetry-instrumentation-asgi==0.65b0",
    "opentelemetry-instrumentation-django==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
    "opentelemetry-propagator-gcp==1.15.0",
    # Was pinned to a pre-release (1.12.0a0) because this package shipped nothing
    # else for a long time, and its one non-prerelease (1.13.0) was yanked upstream
    # for breaking imports. 1.14.0 is a published, un-yanked stable release, so the
    # pre-release pin is no longer needed.
    "opentelemetry-resourcedetector-gcp==1.14.0",
    "opentelemetry-sdk==1.44.0",
    "Pillow==12.3.0",
    "playwright==1.62.0",
    "pre-commit==4.6.2",
    "psycopg[binary,pool]==3.3.5",
    "pygments==2.21.0",
    "python-ulid==4.0.1",
    "pyasn1==0.6.4",
    "pydantic==2.13.5",
    "pydot==4.0.1",
    "PyNaCl==1.6.2",
    "pyparsing==3.3.2",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-watcher==0.6.3",
    "pytest-xdist==3.8.0",
    "python-dotenv==1.2.3",
    "qrcode==8.2",
    "referencing==0.37.0",
    "requests==2.34.2",
    "rich==15.0.0",
    "ruff==0.16.5",
    "setuptools==81.0.0",
    "simpleeval==1.0.7",
    "sqlparse==0.6.0",
    # Security: minimum versions for vulnerable transitive dependencies
    "urllib3>=2.7.0",
    "virtualenv>=21.7.8",
    "whitenoise==6.12.0",
    "markdown-it-py>=4.2.0",
]

[dependency-groups]
# Not shipped: the image installs with --no-dev. django-extensions' shell_plus
# (used by `manage prodshell`) prefers IPython and silently falls back to the
# plain shell without it. It was never declared, so once installs became
# `uv sync` — which prunes anything the lock does not mention — a hand-installed
# copy would disappear and the piped-query workflow in CLAUDE.md would quietly
# stop working.
dev = [
    "ipython==9.17.1",
]

[tool.uv]
# Resolve only for the environments we actually run: CPython on Linux (Cloud Run)
# and macOS (development). Without this the lock has to satisfy every environment
# uv can imagine, including PyPy-on-Windows — and autobahn caps `cbor2<6` there,
# which dragged cbor2 down to 5.9.0 for everyone while pip was installing 6.1.3.
# Declaring reality keeps the lock identical to what we actually deploy.
environments = [
    "sys_platform == 'linux' and platform_python_implementation == 'CPython'",
    "sys_platform == 'darwin' and platform_python_implementation == 'CPython'",
]

# uv.lock's format is versioned. An older uv silently rewrites the lock to its
# own older format, which then fails the `--locked` assertion on every install
# with no obvious cause. Refusing to run is clearer: uv prints "Update `uv` by
# running `uv self update`". Raise this floor when the lock is next regenerated.
# 0.11.12 is what dependabot-core ships, so anything older cannot round-trip
# a lock it writes.
required-version = ">=0.11.12"

[project.scripts]
manage = "scripts.manage:main"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -p no:warnings -n auto --nomigrations --strict-markers"
DJANGO_SETTINGS_MODULE = "gyrinx.settings_dev"
python_files = "tests.py test_*.py *_tests.py"
markers = [
    "core: the required CI job runs these (pytest -m core); see docs/developing-gyrinx/testing.md",
]

[tool.setuptools.packages]
find = {}

[tool.setuptools_scm]

[tool.ruff]
# Matches `requires-python`. Held at py312 while 3.14 was unproven, because
# letting ruff target the real runtime makes the formatter emit PEP 758
# `except A, B:` — syntax that parses on 3.14 and nowhere else, which takes away
# the option of rolling the Docker base image back. 3.14 has now run in
# production, so the rollback is no longer worth holding the syntax back for.
target-version = "py314"

[tool.ruff.lint]
# The selection is pinned rather than left to ruff's defaults. Without this, a
# ruff upgrade silently changes which rules apply: 0.16 turned on a dozen extra
# families and reported 1918 new errors on unchanged code — 1086 of them RUF012,
# which objects to the mutable class attributes Django models are built from.
# Adopting new rules should be a deliberate decision, not a side effect of a
# version bump — so anything added here was added on purpose.
#
# `I` and `UP` were adopted deliberately, as #2093 groundwork: the incoming n26
# edition has enforced them since it started and is clean on both, so converging
# now costs one mechanical pass instead of a merge-time argument. `I` also ends
# the import-ordering drift that needed hand-fixing repeatedly during the
# platform/edition split.
#
# `B` (bugbear) and `DJ` (flake8-django) complete the set n26 enforces, so the
# two codebases now agree on lint before the merge.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "DJ"]

# Three DJ rules are exempted rather than fixed. Each was measured first, and
# in each case the change costs more than the rule is worth here.
ignore = [
    # Nullable string fields. Fixing properly is not an annotation change, it is
    # a data migration: production holds ~186k NULLs in core_event.session_id,
    # ~586k in core_event.field and ~17k in core_listaction.subject_app. Running
    # that over the two largest tables in the database, to remove a second way of
    # spelling "empty" that nothing is currently confused by, is not a good trade.
    "DJ001",
    # `fields = "__all__"` on ModelForms. All eight are in the Django admin, which
    # sits behind a superuser check and 2FA — the mass-assignment risk this guards
    # against is about untrusted input. Explicit field lists would also mean every
    # new model field silently fails to appear in the admin until someone adds it
    # by hand, which is a poor trap to set in a content-authoring tool.
    "DJ007",
    # Model body ordering. Purely cosmetic — no behavioural effect whatsoever —
    # and satisfying it means hoisting comment-rich `Meta` blocks (one carries the
    # §4.1 pin invariant) above methods in the hottest model files. Churn without
    # benefit. Mechanical to revisit if the ordering ever actually bothers anyone.
    "DJ012",
]

[tool.ruff.format]
# 0.16 began formatting Python inside Markdown code fences. Every file it wanted
# to rewrite here was Markdown — no real source needed reformatting — and the
# rewrites damaged docs: hand-aligned trailing comments got collapsed, and an
# illustrative `= (...)` placeholder became `= ...`, changing what the example
# says. Prose is not source; keep the formatter off it.
exclude = ["*.md"]

[tool.djlint]
profile = "django"
custom_blocks = "element,slot,setvar,is_active"
# H026 fires on the `class=""` default that every cotton component must declare
# in <c-vars> to merge caller-supplied classes (cotton has no auto-merge: an
# undeclared `class` emits two class attributes and the caller's is dropped).
# T038: 1.42.3 started linting template tags written *inside* {% comment %}
# blocks. allauth/elements/button.html documents its own `{% element %}` and
# `{% if %}` API in prose and gets 6 false "no matching end tag" errors for it,
# with no such tags in the rendered body. The rule cannot distinguish prose from
# markup, so it is off rather than sprinkling djlint:off through comments — that
# file deliberately removed one such hack.
ignore = "H006,H026,T038"
# django-cotton components (<c-btn>, <c-slot>, <c-forms.field>, <c-vars />).
# Without this djlint treats them as unknown inline tags and FLATTENS the
# indentation of their children instead of nesting it.
custom_html = "c-[\\w.-]+"
# django-cotton component files are byte-significant and hand-formatted. A
# component's file content is emitted verbatim, so a TRAILING NEWLINE lands
# after the closing tag and collapses to a rendered space between adjacent
# inline elements -- e.g. the dice-result badges butted together inside the
# for-loop at core/campaign/campaign_action_outcome.html:22.
# `djlint --reformat` appends that newline even when the file carries
# `djlint:off`, and reports "0 files were updated" while doing it. So the
# component directory is excluded outright. pre-commit's end-of-file-fixer is
# excluded for the same path in .pre-commit-config.yaml.
# Golden HTML snapshots are RENDERED OUTPUT, not templates. djlint --reformat
# rewrites them (verified: "16 files would be updated"), which would silently
extend_exclude = "gyrinx/templates/cotton,n26/core/templates/cotton"

[tool.bandit]
exclude_dirs = [
    ".venv",
    ".git",
    # Claude's working notes are untracked scratch, not shipped code — but
    # bandit -r . reads them and fails commits on whatever they contain.
    ".claude",
    "__pycache__",
    "*/migrations/*",
    "*/tests/*",
    "scripts/test.sh",
    # Python... in node_modules?
    "node_modules",
    ".claude/worktrees"
]
skips = [
    "B101",  # assert_used - we use assert in tests
    "B601",  # paramiko_calls - we don't use paramiko
    "B603",  # subprocess_without_shell_equals_true - reviewed case by case
]
