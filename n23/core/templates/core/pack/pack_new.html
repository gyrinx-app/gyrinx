{% extends "core/layouts/base.html" %}
{% load custom_tags %}
{% block head_title %}
    New Content Pack
{% endblock head_title %}
{% block content %}
    {{ form.media }}
    <c-back />
    <div class="col-12 col-md-8 col-lg-6 px-0 vstack gap-3">
        <h1 class="h3">Create a new Content Pack</h1>
        <form action="{% url 'core:packs-new' %}"
              method="post"
              class="vstack gap-3">
            {% csrf_token %}
            {{ form }}
            <div class="mt-3">
                <c-btn variant="success" type="submit">
                    Create
                </c-btn>
                <c-cancel url="{% safe_referer '/packs/' %}" />
            </div>
        </form>
    </div>
{% endblock content %}
