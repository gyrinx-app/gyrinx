{% extends "account/base_manage.html" %}
{% block head_title %}Account overview{% endblock head_title %}
{% block content %}
    <c-n26.section title="Overview">
        <div class="grid grid-cols-2 gap-3 sm:grid-cols-3">
            {% for label, count in account_stats %}
                <div class="rounded-box border border-box-border bg-box p-4">
                    <div class="text-3xl font-semibold tabular-nums">{{ count }}</div>
                    <div class="mt-1 text-sm text-muted">{{ label }}</div>
                </div>
            {% endfor %}
        </div>
    </c-n26.section>
{% endblock content %}
