{% comment %}
    Store the browser's IANA timezone as a fallback for the next request;
    a saved profile timezone takes precedence. Match COOKIE_NAME in
    gyrinx/timezones.py. Write the raw name so the cookie check below can compare
    it directly with the browser timezone.
{% endcomment %}
<script>
    (function() {
        try {
            var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            if (!tz || !/^[A-Za-z0-9_+\-\/]+$/.test(tz)) return;
            var match = document.cookie.match(/(?:^|; )gyrinx_tz=([^;]*)/);
            if (match && match[1] === tz) return;
            document.cookie = "gyrinx_tz=" + tz +
                ";path=/;max-age=31536000;samesite=lax" +
                (location.protocol === "https:" ? ";secure" : "");
        } catch (e) {}
    })();
</script>
