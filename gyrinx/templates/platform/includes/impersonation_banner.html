{% if is_impersonating %}
    <div class="bg-danger text-white" id="impersonation-banner">
        <div class="container">
            <div class="hstack gap-2 flex-wrap py-2 align-items-center">
                <i class="bi-person-bounding-box"></i>
                <div class="flex-grow-1">
                    Impersonating <strong>{{ request.user.username }}</strong> — signed in as {{ impersonator.username }}. Everything you do is recorded as this user.
                </div>
                <form method="post" action="{% url 'core:impersonate-stop' %}" class="m-0">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.get_full_path }}">
                    <button type="submit" class="btn btn-sm btn-light">
                        <i class="bi-box-arrow-left"></i> Stop impersonating
                    </button>
                </form>
            </div>
        </div>
    </div>
{% endif %}
