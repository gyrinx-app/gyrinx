{% load allauth %}
{{ attrs.errors }}
<div class="space-y-2">
    {% if attrs.type == "textarea" %}
        <label for="{{ attrs.id }}" class="text-sm font-medium">
            {% slot label %}
            {% endslot %}
        </label>
        <textarea class="w-full rounded-control border border-box-border bg-box px-3 py-2 text-sm focus-ring"
                  {% if attrs.required %}required{% endif %}
                  {% if attrs.rows %}rows="{{ attrs.rows }}"{% endif %}
                  {% if attrs.disabled %}disabled{% endif %}
                  {% if attrs.readonly %}readonly{% endif %}
                  {% if attrs.checked %}checked{% endif %}
                  {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
                  {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
                  {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}>{% slot value %}{% endslot %}</textarea>
    {% elif attrs.type == "checkbox" %}
        <div class="flex items-start gap-2">
            <input class="size-4 accent-accent focus-ring"
                   {% if attrs.required %}required{% endif %}
                   {% if attrs.disabled %}disabled{% endif %}
                   {% if attrs.readonly %}readonly{% endif %}
                   {% if attrs.checked %}checked{% endif %}
                   {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
                   {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
                   {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
                   {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %}
                   type="{{ attrs.type }}">
            <label for="{{ attrs.id }}" class="text-sm">
                {% slot label %}
                {% endslot %}
            </label>
        </div>
    {% elif attrs.type == "radio" %}
        <div class="flex items-start gap-2">
            <input class="size-4 accent-accent focus-ring"
                   {% if attrs.required %}required{% endif %}
                   {% if attrs.disabled %}disabled{% endif %}
                   {% if attrs.readonly %}readonly{% endif %}
                   {% if attrs.checked %}checked{% endif %}
                   {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
                   {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
                   {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
                   {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %}
                   type="{{ attrs.type }}">
            <label for="{{ attrs.id }}" class="text-sm">
                {% slot label %}
                {% endslot %}
            </label>
        </div>
    {% else %}
        <label for="{{ attrs.id }}" class="text-sm font-medium">
            {% slot label %}
            {% endslot %}
        </label>
        <input class="w-full rounded-control border border-box-border bg-box px-3 py-2 text-sm focus-ring"
               {% if attrs.required %}required{% endif %}
               {% if attrs.disabled %}disabled{% endif %}
               {% if attrs.readonly %}readonly{% endif %}
               {% if attrs.checked %}checked{% endif %}
               {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
               {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
               {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
               {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
               {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %}
               type="{{ attrs.type }}">
    {% endif %}
    {% if slots.help_text %}
        <div class="text-sm text-muted">
            {% slot help_text %}
            {% endslot %}
        </div>
    {% endif %}
</div>
