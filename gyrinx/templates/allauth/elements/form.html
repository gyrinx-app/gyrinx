{% load allauth %}
<form class="space-y-6 {% if not attrs.wide %}max-w-xl{% endif %}"
      method="{{ attrs.method }}"
      {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
      action="{{ attrs.action }}">
    {% slot body %}
    {% endslot %}
    <c-n26.form-actions>
        {% slot actions %}
        {% endslot %}
    </c-n26.form-actions>
</form>
