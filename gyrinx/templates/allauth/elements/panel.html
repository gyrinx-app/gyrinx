{% load allauth %}
<c-n26.section>
    <c-slot name="title">
        {% slot title %}
        {% endslot %}
    </c-slot>
    <div class="space-y-4 rounded-box border border-box-border bg-box p-4">
        {% slot body %}
        {% endslot %}
        {% if slots.actions %}<div class="flex flex-wrap gap-3">{% for action in slots.actions %}{{ action }}{% endfor %}</div>{% endif %}
    </div>
</c-n26.section>
