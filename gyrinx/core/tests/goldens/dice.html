    <div class="col-lg-12 px-0 vstack gap-4 js-dice" data-mode="d6">
        <h1 class="visually-hidden">Roll some dice</h1>
        <div class="d-grid gap-2 d-sm-flex align-items-center">
            <a rel="nofollow"
               class="js-roll-d6 btn btn-lg btn-primary"
               href="?m=d6&amp;seed=c386bbc4">
                <i class="bi-dice-6"></i> Roll D6
            </a>
            <a rel="nofollow"
               class="js-roll-d3 btn btn-lg btn-outline-primary"
               href="?m=d3&amp;seed=c386bbc4">
                <i class="bi-dice-3"></i> Roll D3
            </a>
            <a rel="nofollow"
               class="js-reset btn btn-lg btn-outline-secondary ms-sm-auto"
               href="?m=d6&d=1">Reset</a>
        </div>
        <div class="row g-3 js-dice-groups">

                <div class="col-12 col-md-6 col-xl-3 dice-group">
                    <div class="border rounded p-3 vstack gap-3 h-100">
                        <div class="hstack gap-2">
                            <div class="btn-group flex-grow-1">
                                <a rel="nofollow"
                                   class="js-sub-die btn btn-outline-secondary disabled"
                                   href="?d=1"
                                   aria-label="Remove one die"
                                   aria-disabled="true">
                                    <i class="bi-dash-lg"></i>
                                </a>
                                <a rel="nofollow"
                                   class="js-set-one btn btn-outline-secondary disabled"
                                   href="?d=1"
                                   aria-disabled="true">1</a>
                                <a rel="nofollow"
                                   class="js-add-die btn btn-outline-primary"
                                   href="?d=2"
                                   aria-label="Add one die">
                                    <i class="bi-plus-lg"></i>
                                </a>
                            </div>
                            <a rel="nofollow"
                               class="js-remove-group link-danger text-decoration-none lh-1"
                               href="?"
                               aria-label="Remove dice group">
                                <i class="bi-x-lg"></i>
                            </a>
                        </div>
                        <div class="dice-tray hstack gap-2 flex-wrap">


                                    <span class="dice-placeholder" role="img" aria-label="Not yet rolled"></span>


                        </div>
                    </div>
                </div>

        </div>
        <div class="hstack justify-content-center">
            <a class="js-add-group btn btn-outline-primary"
               href="?d=1&amp;fp=0&amp;i=0">
                <i class="bi-plus-lg"></i> New dice group
            </a>
        </div>
    </div>
