{% extends "core/layouts/base.html" %}
{% block head_title %}
    Edit Battle - {{ battle.name }}
{% endblock head_title %}
{% block content %}
    {% url 'core:battle' battle.id as battle_url %}
    <c-back url="{{ battle_url }}" text="Back to Battle" />
    <div class="col-12 col-md-8 col-lg-6 px-0 vstack gap-3">
        <h1 class="h3">Edit Battle</h1>
        <p class="text-secondary">{{ battle.name }}</p>
        <form method="post" class="vstack gap-3">
            <c-errors :form="form" class="mb-0" />
            {% csrf_token %}
            {{ form }}
            <c-form.actions intent="save"
                            submit="Save"
                            cancel="{{ battle_url }}"
                            class="hstack gap-3 align-items-center" />
        </form>
    </div>
{% endblock content %}
