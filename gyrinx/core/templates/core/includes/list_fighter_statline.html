{% for stat in fighter.statline %}
    <td class="text-center {% if print %}fs-5{% else %}fs-7{% endif %} {% if stat.highlight %}bg-warning-subtle{% endif %} {{ stat.classes }}">
        {% if stat.modded %}
            <span bs-tooltip
                  data-bs-toggle="tooltip"
                  class="tooltipped"
                  title="{% if stat.modded_by %}Modified by {{ stat.modded_by }}{% else %}Modified manually{% endif %}">{{ stat.value }}</span>
        {% else %}
            {{ stat.value }}
        {% endif %}
    </td>
{% endfor %}
