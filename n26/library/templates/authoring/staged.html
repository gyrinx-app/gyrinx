{% extends "authoring/base.html" %}
{% load react %}
{% block head_title %}
    Staged content
{% endblock head_title %}
{% block content %}
    <c-n26.page-header title="Staged content"
                       lead="Content held back from players until you put it live. It shows for you on every page where players would see it.">
        <c-slot name="breadcrumb">
            <c-ui.breadcrumbs>
                <c-ui.breadcrumbs.item href="{% url 'authoring-index' %}">Content library</c-ui.breadcrumbs.item>
                <c-ui.breadcrumbs.item :current="True">
                    Staged content
                </c-ui.breadcrumbs.item>
            </c-ui.breadcrumbs>
        </c-slot>
        {% if count %}
            <c-slot name="actions">
                <c-ui.button href="{% url 'authoring-staged-delete' %}" variant="ghost">
                    Delete everything staged
                </c-ui.button>
            </c-slot>
        {% endif %}
    </c-n26.page-header>
    <div class="mt-6">{% react_island "authoring-staged" staged_content %}</div>
{% endblock content %}
