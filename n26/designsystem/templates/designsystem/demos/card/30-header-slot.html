{# title: Header slot and flush content #}
{# note: padding="none" removes the body padding, which is what you want when the content is a table that should reach the card's edges. #}
{# layout: full #}
<c-ui.card padding="none">
    <c-slot name="header">
        <div class="flex items-center justify-between gap-3">
            <div>
                <div class="font-semibold">Roster</div>
                <div class="text-sm text-muted">3 fighters</div>
            </div>
            <c-ui.button size="sm" variant="primary">
                Recruit
            </c-ui.button>
        </div>
    </c-slot>
    <c-ui.table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Class</th>
                <th>Cost</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Kaine</td>
                <td>Leader</td>
                <td>145</td>
            </tr>
            <tr>
                <td>Vex</td>
                <td>Champion</td>
                <td>110</td>
            </tr>
            <tr>
                <td>Scrap</td>
                <td>Juve</td>
                <td>40</td>
            </tr>
        </tbody>
    </c-ui.table>
</c-ui.card>
