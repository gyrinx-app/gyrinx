{# title: Underline #}
{# note: hover is the default; always for prose, where a link needs to be findable without pointing at it; none where the surrounding design already marks it. #}
{# layout: col #}
<p>
    <c-n26.link href="/design/" underline="hover">
        Underline on hover
    </c-n26.link>
</p>
<p>
    <c-n26.link href="/design/" underline="always">
        Always underlined
    </c-n26.link>
</p>
<p>
    <c-n26.link href="/design/" underline="none">
        Never underlined
    </c-n26.link>
</p>
