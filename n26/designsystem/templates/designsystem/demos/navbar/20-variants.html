<c-ui.navbar :sticky="False"
             variant="pill"
             class="rounded-box border border-box-border">

        <span class="font-semibold">pill</span>
    </c-slot>
    <c-ui.navbar.item href="#" :current="True">
        Active

    <c-ui.navbar.item href="#">
        Other

</c-ui.navbar>

    </c-ui.navbar.item>

    </c-ui.navbar.item>
