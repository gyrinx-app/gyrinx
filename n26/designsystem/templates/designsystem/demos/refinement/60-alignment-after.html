{# title: After #}
{# note: One grid aligns names, ratings and actions while allowing long names to wrap. #}
<div class="p-4">
    <c-n26.section title="Fighter ratings">
        <div class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-x-4 gap-y-3 sm:grid-cols-[minmax(0,1fr)_auto_auto]">
            {% for fighter in fighters %}
                <h3 class="min-w-0 font-medium">{{ fighter.name }}</h3>
                <p class="text-right text-sm tabular-nums text-muted">{{ fighter.rating }} rating</p>
                <div class="col-span-2 mb-2 sm:col-span-1 sm:mb-0">
                    <c-ui.button type="button" size="sm">
                        View fighter
                    </c-ui.button>
                </div>
            {% endfor %}
        </div>
    </c-n26.section>
</div>
