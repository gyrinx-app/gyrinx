{# title: After #}
{# note: Shared section padding and compact entries preserve grouping and readable actions. #}
<div class="p-4">
    <c-n26.section title="Fighters">
        <div class="divide-y divide-box-border">
            {% for fighter in fighters %}
                <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2 py-3 first:pt-0 last:pb-0">
                    <div class="min-w-0 flex-1 basis-40">
                        <h3 class="font-medium">{{ fighter.name }}</h3>
                        <p class="mt-1 text-sm text-muted">{{ fighter.role }} · {{ fighter.rating }} rating · {{ fighter.state }}</p>
                    </div>
                    <c-ui.button type="button" size="sm">
                        View fighter
                    </c-ui.button>
                </div>
            {% endfor %}
        </div>
    </c-n26.section>
</div>
