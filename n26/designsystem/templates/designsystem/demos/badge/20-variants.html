{# title: Solid and pill #}
{# note: Both are spellings of variant, so you can't have a solid pill. #}
<c-ui.badge variant="solid" color="green">
    solid
</c-ui.badge>
<c-ui.badge variant="solid" color="red">
    solid
</c-ui.badge>
<c-ui.badge variant="pill" color="blue">
    pill
</c-ui.badge>
<c-ui.badge variant="pill" color="violet">
    pill
</c-ui.badge>
