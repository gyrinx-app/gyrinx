{# title: Groups and a status dot #}
{# note: The default slot renders outside the clipped circle, which is how you attach a presence indicator. #}
<c-ui.avatar.group>
    <c-ui.avatar initials="KA" color="auto" />
    <c-ui.avatar initials="VX" color="auto" />
    <c-ui.avatar initials="SC" color="auto" />
    <c-ui.avatar initials="+4" />
</c-ui.avatar.group>
<c-ui.avatar initials="ON" color="auto" size="lg">
    <span class="absolute bottom-0 right-0 size-3 rounded-full bg-green-500 ring-2 ring-[var(--color-surface)]"></span>
</c-ui.avatar>
