{# title: Skippable #}
{# note: A block the author let the reader skip. It draws no control of its own: its questions never hold Continue, and where every block on a screen is skippable the screen offers Skip beside Continue. #}
{# layout: full #}
<c-n26.arrival-block :block="arrival_screen.blocks.2">
    <form method="post" action="#">
        {% csrf_token %}
        <input type="hidden"
               name="ask"
               value="{{ arrival_screen.blocks.2.questions.0.key }}">
        <c-n26.arrival-question :question="arrival_screen.blocks.2.questions.0" />
    </form>
</c-n26.arrival-block>
