{# title: A page's actions #}
{# note: The shape at the top of a record: the primary actions, then a joined group of icon buttons, then a dropdown for the rest. gap="tight" is what a row of icon buttons wants. #}
{# layout: full #}
<c-n26.action-bar gap="tight">
    <c-ui.button variant="primary">
        <span class="flex items-center justify-center gap-1.5">
            <c-n26.icon name="user-plus" class="size-4" />
            Add fighter
        </span>
    </c-ui.button>
    <c-ui.button variant="primary">
        <span class="flex items-center justify-center gap-1.5">
            <c-n26.icon name="truck" class="size-4" />
            Add vehicle
        </span>
    </c-ui.button>
    <c-n26.button-group>
        <c-ui.button aria-label="Pin">
            <span class="n26-icon-only">
                <c-n26.icon name="arrow-up-tray" class="size-4" />
            </span>
        </c-ui.button>
        <c-ui.button>
            <span class="flex items-center justify-center gap-1.5">
                <c-n26.icon name="star" class="size-4" />
                0
            </span>
        </c-ui.button>
        <c-ui.button aria-label="Print">
            <span class="n26-icon-only">
                <c-n26.icon name="printer" class="size-4" />
            </span>
        </c-ui.button>
        <c-ui.button>
            <span class="flex items-center justify-center gap-1.5">
                <c-n26.icon name="pencil" class="size-4" />
                Edit
            </span>
        </c-ui.button>
        <c-ui.dropdown align="end">
            <c-slot name="trigger">
                <c-ui.button aria-label="More actions">
                    <span class="flex items-center justify-center gap-0.5">
                        <c-n26.icon name="ellipsis-vertical" class="size-4" stroke_width="2" />
                        <c-n26.icon name="chevron-down" class="size-3" stroke_width="2.5" />
                    </span>
                </c-ui.button>
            </c-slot>
            <c-ui.dropdown.item>
                Duplicate
            </c-ui.dropdown.item>
            <c-ui.dropdown.item>
                Export
            </c-ui.dropdown.item>
            <c-ui.dropdown.separator />
            <c-ui.dropdown.item variant="danger">
                Retire gang
            </c-ui.dropdown.item>
        </c-ui.dropdown>
    </c-n26.button-group>
</c-n26.action-bar>
