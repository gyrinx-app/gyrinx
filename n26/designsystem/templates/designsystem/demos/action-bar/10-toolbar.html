{# title: Filters and toggles #}
{# note: The bar is only layout. It keeps a button, a switch and a dropdown trigger on one centre line, and pushes the trailing slot to the far end. #}
{# layout: full #}
<c-n26.action-bar>
    <c-n26.filter-menu label="House" name="house" :options="houses" />
    <c-n26.choice-menu label="Sort" name="sort" :options="sorts" :selected="'recent'" />
    <c-n26.toggle name="mine" label="Your lists only" :checked="True" />
    <c-n26.toggle name="archived" label="Archived" />
    <c-slot name="trailing">
        <c-ui.button size="sm" variant="text">
            Reset all
        </c-ui.button>
    </c-slot>
</c-n26.action-bar>
