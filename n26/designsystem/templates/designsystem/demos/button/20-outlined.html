{# title: Outlined #}
{# note: :outlined swaps every variant to a bordered version of itself. Useful for a secondary action sitting next to a solid one. #}
<c-ui.button :outlined="True">
    Default
</c-ui.button>
<c-ui.button :outlined="True" variant="primary">
    Primary
</c-ui.button>
<c-ui.button :outlined="True" variant="success">
    Success
</c-ui.button>
<c-ui.button :outlined="True" variant="danger">
    Danger
</c-ui.button>
<c-ui.button :outlined="True" variant="ghost">
    Ghost
</c-ui.button>
