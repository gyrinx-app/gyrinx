{% comment %}
<c-n26.site.nav.gang> — One gang in the navigation drawer, as a single link.

Nested interactive content inside this link is invalid HTML.
Keep the colour mark inside the name span. A column of its own would indent the type when colour is empty.
{% endcomment %}

<c-vars href="#" name="" type="" type_icon="" colour="" class="" />

<a href="{{ href }}"
   {{ attrs }}
   class="flex flex-col rounded-control px-3 py-2 transition-colors
          hover:bg-ink-100 dark:hover:bg-ink-800 {{ class }}">

    <span class="truncate text-sm text-ink-700 dark:text-ink-300"><c-n26.color-swatch color="{{ colour }}" />{{ name }}</span>
    {% if type %}
        <span class="truncate text-xs text-ink-500 dark:text-ink-400"><c-n26.flair-link text="{{ type }}" tone="current"><c-n26.flair.gang-type :icon="type_icon" /></c-n26.flair-link></span>
    {% endif %}
</a>
