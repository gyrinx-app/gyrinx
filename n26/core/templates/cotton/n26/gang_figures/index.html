{% comment %}
<c-n26.gang-figures> — Roster count beside the gang's wealth strip.

Keep the count outside the wealth wrapper. A purchase replaces the money figures and must not rebuild the model count.
Pass gang as any object with the wealth field names. A Gang and a GangSheet both work.
{% endcomment %}

<c-vars :gang="None" :summary="None" trade_points_href="" credits_href="" class="" />

<div {{ attrs }} class="flex items-center gap-3 {{ class }}">
    <c-n26.roster-summary :summary="summary" />
    <c-n26.gang-figures.wealth :sheet="gang" trade_points_href="{{ trade_points_href }}" credits_href="{{ credits_href }}" />
</div>
