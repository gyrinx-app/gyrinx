{% comment %}
<c-ui.tabs.tab> — one tab and its panel, inside <c-ui.tabs>.

Overrides the kit, which declares only `name` — so an `icon` passed for
the strip's registration also falls into `{{ attrs }}` and lands on the
panel div as a literal icon="<svg …>" attribute. Contained only while
the markup happens to hold no double quote; one in a future icon string
would break out of the attribute. Declaring both keeps the panel clean.

  name — the tab's label, and the key the strip switches on.
  icon — markup drawn before the label on the strip's button, or empty.
{% endcomment %}
<c-vars name icon="" />

<div x-init="register('{{ name }}', '{{ icon|default:''|escapejs }}')"
     x-show="isActive('{{ name }}')"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 translate-y-1"
     x-transition:enter-end="opacity-100 translate-y-0"
     style="display: none;"
     role="tabpanel"
     tabindex="0"
     class="mt-2"
     {{ attrs }}>
    {{ slot }}
</div>
