{% comment %}
<c-ui.description> — Small supporting text beneath or beside a form control.

Field instructions use text-sm; ordinary explanatory paragraphs use the body size.
Declare class explicitly so caller attributes preserve the typography defaults.
{% endcomment %}
<c-vars class="" />
<div {{ attrs }} class="text-sm text-ink-600 dark:text-ink-400 mt-1.5 {{ class }}">
    {{ slot }}
</div>
