<template id="n26-react-error">
    <c-ui.alert variant="error" :dismissible="False">
        <p data-react-error-message></p>
        <div class="mt-3 flex flex-wrap items-center gap-3" data-busy="off">
            <c-ui.button type="button" size="sm" variant="default" data-react-retry>
                <span data-react-retry-spinner hidden>
                    <c-n26.icon name="loader-circle" class="size-4 animate-spin" />
                </span>
                Try again
            </c-ui.button>
            <c-n26.link href="#" data-react-reload>
                Reload page
            </c-n26.link>
        </div>
    </c-ui.alert>
</template>
