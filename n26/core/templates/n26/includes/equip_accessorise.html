{% comment %}
Render one prebuilt accessory dialog per weapon, selecting the open one from the URL.
Include only on pages with every partial-response host, because these dialogs submit
through htmx.
{% endcomment %}
{% for panel in accessorise %}
    <c-n26.owned-dialog :dialog="panel"
                        :open="panel.open"
                        :htmx="True"
                        id="n26-accessorise-{{ panel.id }}">
        {% csrf_token %}
    </c-n26.owned-dialog>
{% endfor %}
