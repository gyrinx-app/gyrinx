{% comment %}
One campaign counter value and its existing tally forms. Both the campaign
table and the gang sheet reserve this host; a tally redraws just this value.
{% endcomment %}
<span id="n26-counter-{{ counter.assignment_id }}"
      class="inline-flex items-center gap-2"
      {% if redrawn %} hx-swap-oob="true"{% endif %}>
    <span class="tabular-nums" data-counter-value>{{ counter.value }}</span>
    <c-n26.counter-controls :counter="counter" :htmx="True" :steps="steps" />
</span>
