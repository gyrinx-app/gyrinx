<c-n26.radio-cards label="Gang" name="membership" :form="form" min="min(100%, 18rem)">
    {% for membership, checked in choices %}
        <c-n26.radio-cards.card name="membership"
                                value="{{ membership.pk }}"
                                label="{{ membership.gang.name }}"
                                description="{{ membership.gang.gang_type }} · {{ membership.gang.owner.username }}"
                                :checked="checked"
                                :wrap="True" />
    {% empty %}
        <p class="text-sm text-muted">No gangs in this campaign yet.</p>
    {% endfor %}
</c-n26.radio-cards>
