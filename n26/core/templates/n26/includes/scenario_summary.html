{% comment %}
Render a compact list of ScenarioResult table names and results for save and battle
forms.
{% endcomment %}
<dl class="divide-y divide-box-border text-sm">
    {% for result in results %}
        <div class="flex items-baseline justify-between gap-4 py-2">
            <dt class="text-muted">{{ result.heading }}</dt>
            <dd class="text-right font-medium">
                {{ result.entry.label }}
            </dd>
        </div>
    {% endfor %}
</dl>
