{% comment %}
Share the rename action between full cards and partial responses. Edit can fetch the
dialog into its host; other pages navigate to Edit.
{% endcomment %}
{% firstof card.rename_href rename_href as rename_dialog_href %}
{% if rename_dialog_href %}
    <c-ui.button variant="text"
                 size="xs"
                 class="ms-1 py-0!"
                 id="n26-name-pencil-{{ miniature.pk }}"
                 href="{{ rename_dialog_href }}"
                 hx-get="{{ rename_dialog_href }}"
                 hx-swap="none"
                 aria-label="Rename {{ miniature.name }}"
                 title="Rename">
        <span class="n26-icon-inline">
            <c-n26.icon name="pencil" />
        </span>
    </c-ui.button>
{% else %}
    <c-ui.button variant="text"
                 size="xs"
                 class="ms-1 py-0!"
                 href="{% url 'n26-edit-fighter' miniature.pk %}?rename={{ miniature.pk }}"
                 aria-label="Rename {{ miniature.name }}"
                 title="Rename">
        <span class="n26-icon-inline">
            <c-n26.icon name="pencil" />
        </span>
    </c-ui.button>
{% endif %}
