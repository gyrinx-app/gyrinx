{% comment %}
Render the Confirmation checkbox using the same input styling as the hire dialog.
{% endcomment %}
<label class="flex cursor-pointer items-start gap-2.5">
    <input type="checkbox"
           name="{{ checkbox.name }}"
           value="{{ checkbox.value }}"
           {% if checkbox.checked %}checked{% endif %}
           class="mt-0.5 size-4 shrink-0 accent-[var(--color-accent)] focus-ring">
    <span class="text-sm text-ink-900 dark:text-ink-100">
        {{ checkbox.label }}
        {% if checkbox.description %}<span class="block text-muted">{{ checkbox.description }}</span>{% endif %}
    </span>
</label>
