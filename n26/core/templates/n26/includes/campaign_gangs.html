{% comment %}
Render the gangs table or its empty state in one stable host. Replace the whole table
after rolls because a result can change cell content and available controls.
{% endcomment %}
<div id="n26-campaign-gangs" {% if redrawn %}hx-swap-oob="true"{% endif %}>
    {% if sheet.gangs %}
        <c-n26.campaign-gangs :sheet="sheet" />
    {% else %}
        <p class="p-4 text-sm text-muted">No gangs in this campaign yet.</p>
    {% endif %}
</div>
