{% comment %}
Toggle expanded in the containing Alpine scope and update the URL while preserving
current section parameters. Without JavaScript, owned_toggle_href lets the server render
the entry open.
{% endcomment %}
<c-ui.button href="{{ owned_toggle_href }}"
             size="sm"
             class="inline-flex items-center gap-1.5"
             x-on:click.prevent="expanded = !expanded;
                                 (() => {
                                     const here = new URL(location);
                                     if (expanded) here.searchParams.set('owned', '{{ row.key|escapejs }}');
                                     else here.searchParams.delete('owned');
                                     history.replaceState(history.state, '', here);
                                 })()"
             aria-expanded="{{ row.expanded|yesno:'true,false' }}"
             ::aria-expanded="expanded">
    <span><span class="tabular-nums">{{ row.count }}</span> {{ held_label|default:"equipped" }}</span>
    <span class="n26-icon-only">
        <c-n26.icon name="chevron-down"
                    class="size-3 transition-transform{% if row.expanded %} rotate-180{% endif %}"
                    ::class="{ 'rotate-180': expanded }"
                    stroke_width="2.5" />
    </span>
</c-ui.button>
