{% comment %}
Replace the stable dialog host with a confirmation or empty content to close it. redrawn
restores the previous URL on dismissal; htmx controls submission only on pages
supporting the response targets.
{% endcomment %}
<div id="n26-dialog-host" hx-swap-oob="true">
    {% if dialog %}
        <c-n26.owned-dialog :dialog="dialog" :redrawn="True" :htmx="htmx">
            {% csrf_token %}
        </c-n26.owned-dialog>
    {% endif %}
</div>
