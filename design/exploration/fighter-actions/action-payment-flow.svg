<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1030" role="img" aria-labelledby="title desc"><title id="title">Final checkout for paid actions</title><desc id="desc">All choices are unpaid until final confirmation. Cancellation needs no refund. Confirmation validates the review and atomically commits payment, result changes and completion. Repeats return the existing receipt; changed terms return to review; failures roll back.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#697386"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#202a3c}.head{font-size:16px;font-weight:650}.detail{font-size:13px;fill:#697386}.label{font-size:12px;fill:#46556a;paint-order:stroke;stroke:#f7f8fa;stroke-width:6;stroke-linejoin:round}</style><path d="M825 85H910" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="865" y="68" text-anchor="middle">cancel</text><path d="M575 145V225" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="638" y="190" text-anchor="middle">choices ready</text><path d="M575 340V415" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="680" y="382" text-anchor="middle">confirm purchase</text><path d="M420 530L185 630" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="230" y="577" text-anchor="middle">repeat request</text><path d="M575 530L590 630" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="644" y="584" text-anchor="middle">valid</text><path d="M735 530L1015 630" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="940" y="580" text-anchor="middle">needs review</text><path d="M1200 680H1220V282H825" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="1090" y="267" text-anchor="middle">review again</text><path d="M590 770V875" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="683" y="832" text-anchor="middle">transaction fails</text><rect x="325" y="25" width="500" height="120" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="341" y="53">Choose the result</text><text class="detail" x="341" y="78">Select the outcome, item and tier as needed</text><text class="detail" x="341" y="97">Save an unpaid ActionRecord to continue later</text><text class="detail" x="341" y="116">Clearing glitches skips item selection</text><rect x="910" y="25" width="280" height="120" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="926" y="53">Cancel unfinished action</text><text class="detail" x="926" y="78">Cancel the saved choices</text><text class="detail" x="926" y="97">No payment to refund</text><rect x="325" y="225" width="500" height="115" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="341" y="253">Review and pay</text><text class="detail" x="341" y="278">Review the selected result and every price component</text><text class="detail" x="341" y="297">Final confirmation is the payment point</text><rect x="325" y="415" width="500" height="115" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="341" y="443">Validate under the gang lock</text><text class="detail" x="341" y="468">Check record revision, review, balances and exact targets</text><text class="detail" x="341" y="487">A completed record returns its existing receipt</text><rect x="20" y="630" width="330" height="115" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="36" y="658">Already completed</text><text class="detail" x="36" y="683">Return the same record and receipt</text><text class="detail" x="36" y="702">Do not charge again</text><rect x="405" y="630" width="370" height="140" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="421" y="658">Valid confirmation</text><text class="detail" x="421" y="683">One transaction: every payment debit</text><text class="detail" x="421" y="702">+ result changes + completed state</text><text class="detail" x="421" y="721">Tier changes and glitch clearing</text><text class="detail" x="421" y="740">use this same boundary</text><rect x="830" y="630" width="370" height="140" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="846" y="658">Changed or insufficient</text><text class="detail" x="846" y="683">Keep the record unfinished</text><text class="detail" x="846" y="702">Refresh the review or item selections</text><text class="detail" x="846" y="721">No payment or result change</text><rect x="405" y="875" width="370" height="115" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="421" y="903">Failure before commit</text><text class="detail" x="421" y="928">Roll back every debit and result change</text><text class="detail" x="421" y="947">Leave the saved choices unfinished</text></svg>
