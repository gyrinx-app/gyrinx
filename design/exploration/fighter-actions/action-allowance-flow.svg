<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1040" role="img" aria-labelledby="title desc"><title id="title">Allowance rule to completed action</title><desc id="desc">A player-triggered operation awards each source once. An unused allowance starts one record; a started allowance continues its existing record; a completed allowance cannot start again.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#697386"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#202a3c}.head{font-size:16px;font-weight:650}.detail{font-size:13px;fill:#697386}.label{font-size:12px;fill:#46556a;paint-order:stroke;stroke:#f7f8fa;stroke-width:6;stroke-linejoin:round}</style><path d="M555 120V175" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="638" y="152" text-anchor="middle">assess grant</text><path d="M555 275V335" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="648" y="308" text-anchor="middle">source uniqueness</text><path d="M455 425L185 490" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="270" y="453" text-anchor="middle">unused</text><path d="M555 425V490" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="605" y="460" text-anchor="middle">started</text><path d="M665 425L915 490" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="810" y="453" text-anchor="middle">completed</text><path d="M185 605V660H465V705" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="260" y="650" text-anchor="middle">new record</text><path d="M550 605V705" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="625" y="660" text-anchor="middle">existing record</text><path d="M465 805V895" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="570" y="856" text-anchor="middle">selections finished</text><rect x="325" y="25" width="460" height="95" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="341" y="53">Recruitment or XP increase</text><text class="detail" x="341" y="78">Run within the player’s save operation</text><text class="detail" x="341" y="97">Read effective action access and the current table</text><rect x="325" y="175" width="460" height="100" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="341" y="203">Apply the allowance rule</text><text class="detail" x="341" y="228">For ranks: before XP &lt; threshold ≤ after XP</text><text class="detail" x="341" y="247">Create each crossed threshold once; retain earlier grants</text><rect x="325" y="335" width="460" height="90" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="341" y="363">Read this allowance’s state</text><text class="detail" x="341" y="388">Unused, started, or completed</text><rect x="20" y="490" width="330" height="115" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="36" y="518">Unused allowance</text><text class="detail" x="36" y="543">Player starts the action</text><text class="detail" x="36" y="562">Reserve allowance + create record</text><text class="detail" x="36" y="581">Together, under the gang lock</text><rect x="385" y="490" width="330" height="115" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="401" y="518">Started allowance</text><text class="detail" x="401" y="543">Continue its existing action record</text><text class="detail" x="401" y="562">Keep all recorded rolls and choices</text><text class="detail" x="401" y="581">Do not create another use</text><rect x="750" y="490" width="330" height="115" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="766" y="518">Completed allowance</text><text class="detail" x="766" y="543">Show its existing result and history</text><text class="detail" x="766" y="562">No new use of this allowance</text><rect x="210" y="705" width="510" height="100" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="226" y="733">Action record: started</text><text class="detail" x="226" y="758">Make required selections or rolls</text><text class="detail" x="226" y="777">Leaving returns to this same record later</text><rect x="210" y="895" width="510" height="110" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="226" y="923">Complete together</text><text class="detail" x="226" y="948">Write the outcome’s changes and mark the record complete</text><text class="detail" x="226" y="967">The allowance now points to a completed use</text><text class="detail" x="226" y="986">Corrections append history to that same use</text></svg>
