<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Actions: data model proposal</title>
<style>

*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#202a3c;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:36px 28px}h1{font-size:30px;line-height:1.25}h2{font-size:24px;margin:0 0 16px}h3{font-size:18px}p{max-width:80ch}.eyebrow,.muted,footer{color:#697386}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.06em}.lead{font-size:19px}a{color:#076bd8;text-underline-offset:3px}nav{display:flex;flex-wrap:wrap;gap:12px 24px;padding:18px 0;border-block:1px solid #dfe3e9;margin-top:24px}section{padding-top:36px;scroll-margin-top:15px}details{background:white;border:1px solid #dfe3e9;padding:14px 18px;margin:10px 0;border-radius:4px}summary{font-weight:650;cursor:pointer}article{margin:22px 0 32px}pre{background:#eef0f4;border:1px solid #dfe3e9;border-radius:4px;padding:18px;overflow:auto;font:13px/1.65 ui-monospace,SFMono-Regular,monospace;tab-size:2}li{margin:8px 0}footer{font-size:13px;border-top:1px solid #dfe3e9;margin-top:36px;padding-top:20px}@media(max-width:600px){main{padding:24px 16px}h1{font-size:26px}pre{font-size:12px;padding:12px}details{padding:12px}nav{gap:10px 18px}}
.status{display:block;color:#46556a;font:600 11px/1.5 system-ui,sans-serif;letter-spacing:.025em;margin:4px 0}summary .status{font-weight:500}#reuse article{border-left:3px solid #dfe3e9;padding-left:18px}#reuse h3{margin:5px 0}.diagram{overflow-x:auto;background:#f7f8fa;border:1px solid #dfe3e9;margin:20px 0;padding:10px}.diagram img{display:block;width:100%;min-width:780px}#relationships,#process{scroll-margin-top:12px}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid #dfe3e9}th{font-weight:650}#naming td:first-child{white-space:nowrap}

@media(max-width:600px){#naming table,#naming tbody,#naming tr,#naming td{display:block}#naming thead{display:none}#naming tr{padding:16px 0;border-bottom:1px solid #dfe3e9}#naming td{padding:6px 0;border:0}#naming td:first-child{font-size:19px;font-weight:650}#naming td:not(:first-child)::before{content:attr(data-label);display:block;font-size:12px;font-weight:650;color:#697386}}
</style>
</head>
<body>
<main>{{content}}</main>
</body>
</html>
