<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" role="img" aria-labelledby="title desc"><title id="title">Action relationships</title><desc id="desc">Actions own price components, allowance rules and outcomes. Rules award allowances, which can fund action records. Records link to payments and changes. The current rank table and XP change supply grant inputs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#697386"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#202a3c}.head{font-size:16px;font-weight:650}.detail{font-size:13px;fill:#697386}.label{font-size:12px;fill:#46556a;paint-order:stroke;stroke:#f7f8fa;stroke-width:6;stroke-linejoin:round}</style><path d="M310 80H395" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="352" y="64" text-anchor="middle">refers to</text><path d="M690 80H780" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="735" y="64" text-anchor="middle">use_price</text><path d="M542 130V220" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="590" y="178" text-anchor="middle">0..1 rule</text><path d="M690 110L755 170H928V220" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="794" y="158" text-anchor="middle">1..many outcomes</text><path d="M310 270H395" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="352" y="248" text-anchor="middle">rank input</text><path d="M542 320V420" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="592" y="370" text-anchor="middle">awards once</text><path d="M690 475H780" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="735" y="449" text-anchor="middle">0..1 current use</text><path d="M928 320V420" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="974" y="370" text-anchor="middle">selected</text><path d="M928 530V650" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="984" y="590" text-anchor="middle">0..1 payment</text><path d="M830 530L635 650" fill="none" stroke="#697386" stroke-width="1.6" marker-end="url(#arrow)"/><text class="label" x="708" y="600" text-anchor="middle">0..many changes</text><rect x="20" y="30" width="290" height="100" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="36" y="58">Effective action access</text><text class="detail" x="36" y="83">Existing Assignment or computed grant</text><text class="detail" x="36" y="102">NEW assignable Action kind</text><rect x="395" y="30" width="295" height="100" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="411" y="58">Action</text><text class="detail" x="411" y="83">What may be performed</text><text class="detail" x="411" y="102">Owns use_price and outcome choices</text><rect x="780" y="30" width="295" height="100" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="796" y="58">Price components</text><text class="detail" x="796" y="83">All components are required</text><text class="detail" x="796" y="102">[] means no payment</text><rect x="20" y="220" width="290" height="100" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="36" y="248">Rank table + XP change</text><text class="detail" x="36" y="273">Current assigned table</text><text class="detail" x="36" y="292">Counter values before and after</text><rect x="395" y="220" width="295" height="100" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="411" y="248">Allowance rule</text><text class="detail" x="411" y="273">Part of the action definition</text><text class="detail" x="411" y="292">Recruitment grant or rank award</text><rect x="780" y="220" width="295" height="100" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="796" y="248">Outcome</text><text class="detail" x="796" y="273">Augment / resolve slot / apply changes</text><text class="detail" x="796" y="292">One is selected per action record</text><rect x="395" y="420" width="295" height="110" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="411" y="448">Allowance</text><text class="detail" x="411" y="473">One earned or granted use</text><text class="detail" x="411" y="492">Source recorded once</text><text class="detail" x="411" y="511">May be unused, reserved or used</text><rect x="780" y="420" width="295" height="110" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="796" y="448">Action record</text><text class="detail" x="796" y="473">One use: started or completed</text><text class="detail" x="796" y="492">References action and selected outcome</text><text class="detail" x="796" y="511">Payment only on completion</text><rect x="395" y="650" width="295" height="110" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="411" y="678">Changes</text><text class="detail" x="411" y="703">Ledger events linked to the use</text><text class="detail" x="411" y="722">Picks, tiers and counters changed</text><text class="detail" x="411" y="741">Stored together with completion</text><rect x="780" y="650" width="295" height="110" rx="5" fill="white" stroke="#cbd2dc"/><text class="head" x="796" y="678">Payment and lines</text><text class="detail" x="796" y="703">Optional group of ledger events</text><text class="detail" x="796" y="722">Paid with the completed result</text><text class="detail" x="796" y="741">Remembers the original balances</text></svg>
